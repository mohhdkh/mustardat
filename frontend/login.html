<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - مستردات</title>
    <link rel="stylesheet" href="/static/styles.css?v=20261007-6">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="auth-logo"><span class="logo"><img src="/static/assets/logo.svg?v=1" alt=""></span><span>مستردات</span></a>
                <h1>Welcome Back</h1>
                <p>Sign in to your account</p>
            </div>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                </div>
                
                <button type="submit" id="submitBtn" class="btn btn-primary btn-block btn-lg">Sign In</button>
            </form>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="/static/register.html">Create one</a></p>
                <a href="/" class="back-link">← Back to Home</a>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast"></div>
    
    <script src="/static/js/api.js?v=20261007-3"></script>
    <script src="/static/js/ar.js?v=20261007-3"></script>
    <script>
        // Redirect if already logged in
        if (API.isLoggedIn()) {
            window.location.href = '/';
        }
        
        document.getElementById('loginForm').onsubmit = async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                UI.toast('أدخل البريد الإلكتروني وكلمة المرور.', 'error');
                return false;
            }
            
            btn.textContent = 'جارٍ تسجيل الدخول...';
            btn.disabled = true;
            
            try {
                const data = await API.auth.login(email, password);
                API.saveAuth(data.access_token);
                
                // Get user profile
                try {
                    const user = await API.auth.getProfile();
                    API.saveAuth(data.access_token, user);
                } catch (profileError) {
                    console.warn('تعذر تحميل بيانات الحساب:', profileError);
                }
                
                UI.toast('تم تسجيل الدخول بنجاح. جارٍ تحويلك...', 'success');
                
                // Redirect after short delay
                setTimeout(function() {
                    console.log('Redirecting to home...');
                    window.location.href = '/';
                }, 500);
                
            } catch (error) {
                console.error('خطأ في تسجيل الدخول:', error);
                UI.toast(error.message, 'error');
                btn.textContent = 'تسجيل الدخول';
                btn.disabled = false;
            }
            
            return false;
        };
    </script>
</body>
</html>
